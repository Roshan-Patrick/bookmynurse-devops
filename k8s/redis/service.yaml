# =============================================================================
# k8s/redis/service.yaml
# Redis Service for Internal Communication
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: redis-service
  namespace: bookmynurse
  labels:
    app: redis
    tier: cache
spec:
  type: ClusterIP
  ports:
  - port: 6379
    targetPort: 6379
    protocol: TCP
    name: redis
  selector:
    app: redis
    tier: cache
