# =============================================================================
# k8s/monitoring/grafana-datasources.yaml
# Grafana Data Sources Configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: bookmynurse
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
    - name: Prometheus
      type: prometheus
      access: proxy
      url: http://prometheus-service:9090
      isDefault: true
      editable: true
    - name: Redis
      type: redis-datasource
      access: proxy
      url: http://redis-service:6379
      editable: true
      # Enterprise Security: Use secureJsonData instead of plain text
      secureJsonData:
        password: ${REDIS_GF_PASSWORD}
