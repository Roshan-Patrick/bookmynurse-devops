name: BookMyNurse CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment Environment'
        required: true
        default: 'production'
        type: choice
        options:
          - testing
          - production

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    outputs:
      backend-changed: ${{ steps.changes.outputs.backend }}
      frontend-changed: ${{ steps.changes.outputs.frontend }}
    # Define the MySQL service container
    services:
      mysql:
        image: mysql:8.0
        # Environment variables for the database service itself
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          MYSQL_DATABASE: bookmynurse_test
        ports:
          - 3306:3306
        # Health check to ensure MySQL is ready before tests run
        options: >-
          --health-cmd="mysqladmin ping -h localhost -p${{ secrets.TEST_DB_PASSWORD }}"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
      
      - name: Check for file changes
        uses: dorny/paths-filter@v2
        id: changes
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'k8s/backend/**'
            frontend:
              - 'frontend/**'
              - 'k8s/frontend/**'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # CodeQL removed - focusing on core DevOps pipeline
      # - name: Initialize CodeQL
      #   uses: github/codeql-action/init@v2
      #   with:
      #     languages: javascript

      - name: Install MySQL Client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL to be fully ready
        run: |
          # Loop until the mysql server is accepting connections
          until mysql -h 127.0.0.1 -u root -p"${{ secrets.TEST_DB_PASSWORD }}" -e "SELECT 1"; do
            echo "Waiting for MySQL connection..."
            sleep 2
          done

      - name: Setup Test Database Schema
        env:
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
        run: |
          echo "Database is ready. Loading schema..."
          mysql -h 127.0.0.1 -u root -p"${DB_PASSWORD}" bookmynurse_test < backend/test-schema.sql
          echo "Test database schema setup complete."

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm ci

      - name: Run Backend Integration Tests
        # Environment variables for your Node.js app to connect to the service
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: root
          DB_PASSWORD: ${{ secrets.TEST_DB_PASSWORD }}
          DB_NAME: bookmynurse_test
          NODE_ENV: test
          JWT_SECRET: a-very-secret-key-for-testing
        run: |
          cd backend
          echo "Running backend tests against the service database..."
          npm test -- --coverage --watchAll=false

      # Frontend tests removed - focusing on backend testing and DevOps
      # - name: Setup Chrome for Frontend Tests
      #   uses: browser-actions/setup-chrome@v1
      #   with:
      #     chrome-version: stable

      # - name: Run Frontend Tests
      #   run: |
      #     cd frontend
      #     npm ci
      #     # Run Angular tests in headless mode with CI-optimized Chrome
      #     npm run test -- --watch=false --browsers=ChromeHeadlessCI

      # CodeQL analysis removed - not critical for DevOps role
      # - name: Perform CodeQL Analysis
      #   uses: github/codeql-action/analyze@v2

      - name: Build and push backend
        if: steps.changes.outputs.backend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            emmamyers/bmn-backend:${{ github.sha }}
            emmamyers/bmn-backend:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Run Trivy vulnerability scanner on backend
        if: steps.changes.outputs.backend == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'emmamyers/bmn-backend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-backend-results.sarif'
          exit-code: '0'  # Don't fail on vulnerabilities - just report them
          severity: 'HIGH,CRITICAL'

      - name: Build and push frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          tags: |
            emmamyers/bmn-frontend:${{ github.sha }}
            emmamyers/bmn-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
    
      - name: Run Trivy vulnerability scanner on frontend
        if: steps.changes.outputs.frontend == 'true'
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'emmamyers/bmn-frontend:${{ github.sha }}'
          format: 'sarif'
          output: 'trivy-frontend-results.sarif'
          exit-code: '0'  # Don't fail on vulnerabilities - just report them
          severity: 'HIGH,CRITICAL'
    
      # Redis uses official redis:7-alpine image - no custom build needed
      # - name: Build and push Redis image
      #   uses: docker/build-push-action@v4
      #   with:
      #     context: .
      #     file: ./k8s/redis/Dockerfile
      #     push: true
      #     tags: emmamyers/bmn-redis:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Ansible
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Write extra vars file
        env:
          ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_APP_PASSWORD: ${{ secrets.MYSQL_APP_PASSWORD }}
        run: |
          cat <<EOF > extra-vars.yml
          mysql_root_password: "${MYSQL_ROOT_PASSWORD}"
          mysql_app_password: "${MYSQL_APP_PASSWORD}"
          target_host_group: "${ENVIRONMENT}"
          EOF

      - name: Prepare repository archive
        run: |
          echo "=== Current directory contents ==="
          ls -la
          echo "=== k8s directory contents ==="
          ls -la k8s/ || echo "k8s directory not found"
          echo "=== Creating targeted tar archive ==="
          # Create archive with only necessary files to avoid tar errors
          tar -czf repo.tar.gz --exclude='.git' k8s/ backend/ frontend/ ansible/ .github/ README.md .gitignore
          echo "=== Archive created, size: ==="
          ls -lh repo.tar.gz
          echo "=== Archive contents ==="
          tar -tzf repo.tar.gz | head -20

      - name: Copy repository to production server
        run: |
          scp -P ${{ secrets.PRODUCTION_SSH_PORT }} -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 repo.tar.gz root@${{ secrets.PRODUCTION_IP }}:/root/

      - name: Run Ansible playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook -i ansible/ansible_inventory.txt ansible/ansible_playbook.txt --extra-vars "@extra-vars.yml" --extra-vars "confirm_migration=yes"

      - name: Deploy to Kubernetes
        if: github.event.inputs.environment == 'production' || github.ref == 'refs/heads/main'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          
          # SSH to production server and deploy Kubernetes manifests
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -p ${{ secrets.PRODUCTION_SSH_PORT }} root@${{ secrets.PRODUCTION_IP }} << EOF
            # Extract the repository
            echo "Extracting repository..."
            cd /root
            rm -rf bookmynurse-devops
            mkdir -p bookmynurse-devops
            tar -xzf repo.tar.gz -C bookmynurse-devops/
            rm -f repo.tar.gz
            
            # Navigate to the project directory
            cd /root/bookmynurse-devops
            
            # Debug: Show what was extracted
            echo "=== Current directory: \$(pwd) ==="
            echo "=== Extracted files ==="
            ls -la
            echo "=== k8s directory contents ==="
            ls -la k8s/ || echo "k8s directory not found"
            echo "=== backend directory contents ==="
            ls -la k8s/backend/ || echo "backend directory not found"
            echo "=== frontend directory contents ==="
            ls -la k8s/frontend/ || echo "frontend directory not found"
            echo "=== ingress directory contents ==="
            ls -la k8s/ingress/ || echo "ingress directory not found"
            
            # Verify required directories exist
            echo "Verifying project structure..."
            if [ ! -d "k8s" ]; then
              echo "ERROR: k8s directory not found!"
              ls -la
              exit 1
            fi
            
            if [ ! -d "k8s/backend" ] || [ ! -d "k8s/frontend" ] || [ ! -d "k8s/ingress" ]; then
              echo "ERROR: Required k8s subdirectories not found!"
              ls -la k8s/
              exit 1
            fi
            
            # Verify required files exist
            if [ ! -f "k8s/backend/deployment.yaml" ] || [ ! -f "k8s/frontend/deployment.yaml" ] || [ ! -f "k8s/ingress/ingress.yaml" ]; then
              echo "ERROR: Required k8s manifest files not found!"
              echo "Backend deployment: $(ls -la k8s/backend/deployment.yaml 2>/dev/null || echo 'MISSING')"
              echo "Frontend deployment: $(ls -la k8s/frontend/deployment.yaml 2>/dev/null || echo 'MISSING')"
              echo "Ingress: $(ls -la k8s/ingress/ingress.yaml 2>/dev/null || echo 'MISSING')"
              exit 1
            fi
            
            echo "Project structure verified successfully!"

            # Update Kubernetes manifests with the new image tag
            sed -i "s|image: emmamyers/bmn-backend:.*|image: emmamyers/bmn-backend:${GITHUB_SHA}|" k8s/backend/deployment.yaml
            sed -i "s|image: emmamyers/bmn-frontend:.*|image: emmamyers/bmn-frontend:${GITHUB_SHA}|" k8s/frontend/deployment.yaml
            
            # Verify monitoring images use specific versions (not :latest)
            echo "Verifying monitoring image versions..."
            grep -q "image: prom/prometheus:v" k8s/monitoring/prometheus-deployment.yaml || (echo "Prometheus image not pinned!" && exit 1)
            grep -q "image: grafana/grafana:10" k8s/monitoring/grafana-deployment.yaml || (echo "Grafana image not pinned!" && exit 1)
            echo "✅ All monitoring images use specific versions"

            # Create secrets from GitHub Actions secrets
            kubectl create secret generic redis-secret \
              --from-literal=redis-password="${{ secrets.REDIS_PASSWORD }}" \
              -n bookmynurse \
              --dry-run=client -o yaml | kubectl apply -f -
            
            kubectl create secret generic jwt-secret \
              --from-literal=jwt-secret="${{ secrets.JWT_SECRET }}" \
              -n bookmynurse \
              --dry-run=client -o yaml | kubectl apply -f -
            
            # Ensure storage directories exist for PersistentVolumes
            echo "Ensuring storage directories exist..."
            sudo mkdir -p /mnt/data
            sudo mkdir -p /mnt/uploads
            sudo mkdir -p /mnt/redis-data
            sudo chmod 755 /mnt/data
            sudo chmod 755 /mnt/uploads
            sudo chmod 755 /mnt/redis-data
            
            # Apply all Kubernetes manifests
            kubectl apply -f k8s/namespace/ -n bookmynurse
            kubectl apply -f k8s/storage/ -n bookmynurse # Apply storage infrastructure
            kubectl apply -f k8s/secrets/ -n bookmynurse
            kubectl apply -f k8s/mysql/ -n bookmynurse
            kubectl apply -f k8s/redis/ -n bookmynurse  # Deploy Redis StatefulSet
            kubectl apply -f k8s/monitoring/ -n bookmynurse  # Deploy monitoring stack
            kubectl apply -f k8s/backend/ -n bookmynurse
            kubectl apply -f k8s/frontend/ -n bookmynurse
            kubectl apply -f k8s/ingress/ -n bookmynurse
            
            # Wait for deployments to be ready
            kubectl rollout status statefulset/redis-statefulset -n bookmynurse --timeout=300s
            kubectl rollout status deployment/prometheus-deployment -n bookmynurse --timeout=300s
            kubectl rollout status deployment/grafana-deployment -n bookmynurse --timeout=300s
            kubectl rollout status deployment/backend-deployment -n bookmynurse --timeout=300s
            kubectl rollout status deployment/frontend-deployment -n bookmynurse --timeout=300s
            
            # Check deployment status
            echo "=== Deployment Status ==="
            kubectl get pods -n bookmynurse
            kubectl get services -n bookmynurse
            kubectl get ingress -n bookmynurse
            
            # Verify deployment health
            echo "=== Health Check ==="
            kubectl get pods -n bookmynurse | grep -E "(backend|frontend)" | awk '{print $1}' | while read pod; do
              echo "Checking health of $pod..."
              kubectl exec -n bookmynurse $pod -- curl -f http://localhost:3000/health || echo "Health check failed for $pod"
            done
          EOF

      - name: Rollback on Deployment Failure
        if: failure()
        run: |
          echo "🚨 Deployment failed - Checking for rollback options..."
          ssh -o StrictHostKeyChecking=no -o ServerAliveInterval=60 -o ServerAliveCountMax=5 -p ${{ secrets.PRODUCTION_SSH_PORT }} root@${{ secrets.PRODUCTION_IP }} << 'EOF'
            echo "🔍 Checking if deployments exist and have rollout history..."
            
            # Check if backend deployment exists and has history
            if kubectl get deployment backend-deployment -n bookmynurse >/dev/null 2>&1; then
              echo "Backend deployment exists, checking rollout history..."
              if kubectl rollout history deployment/backend-deployment -n bookmynurse >/dev/null 2>&1; then
                echo "🔄 Rolling back backend deployment..."
                kubectl rollout undo deployment/backend-deployment -n bookmynurse
                kubectl rollout status deployment/backend-deployment -n bookmynurse --timeout=300s || echo "Backend rollback failed"
              else
                echo "⚠️ No rollout history for backend deployment - skipping rollback"
              fi
            else
              echo "⚠️ Backend deployment doesn't exist - skipping rollback"
            fi
            
            # Check if frontend deployment exists and has history
            if kubectl get deployment frontend-deployment -n bookmynurse >/dev/null 2>&1; then
              echo "Frontend deployment exists, checking rollout history..."
              if kubectl rollout history deployment/frontend-deployment -n bookmynurse >/dev/null 2>&1; then
                echo "🔄 Rolling back frontend deployment..."
                kubectl rollout undo deployment/frontend-deployment -n bookmynurse
                kubectl rollout status deployment/frontend-deployment -n bookmynurse --timeout=300s || echo "Frontend rollback failed"
              else
                echo "⚠️ No rollout history for frontend deployment - skipping rollback"
              fi
            else
              echo "⚠️ Frontend deployment doesn't exist - skipping rollback"
            fi
            
            echo "✅ Rollback check completed."
            echo "=== Current Pod Status ==="
            kubectl get pods -n bookmynurse || echo "No pods found"
          EOF

  notify:
    runs-on: ubuntu-latest
    needs: deploy
    if: always()
    steps:
      - name: Determine Job Status
        id: job_status
        run: |
          if [ "${{ needs.deploy.result }}" == "success" ]; then
            echo "status_message=✅ Deployment Succeeded" >> $GITHUB_ENV
            echo "status_color=#2EB67D" >> $GITHUB_ENV
          else
            echo "status_message=❌ Deployment Failed" >> $GITHUB_ENV
            echo "status_color=#E01E5A" >> $GITHUB_ENV
          fi
      - name: Send Slack Notification
        uses: slackapi/slack-github-action@v1.24.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ env.status_color }}",
                  "blocks": [
                    {
                      "type": "section",
                      "text": {
                        "type": "mrkdwn",
                        "text": "${{ env.status_message }} on ${{ github.event.inputs.environment || 'production' }}"
                      }
                    },
                    {
                      "type": "section",
                      "fields": [
                        {
                          "type": "mrkdwn",
                          "text": "*Repository:*\n${{ github.repository }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Branch:*\n${{ github.ref_name }}"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Commit:*\n<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha_short }}>"
                        },
                        {
                          "type": "mrkdwn",
                          "text": "*Triggered by:*\n${{ github.actor }}"
                        }
                      ]
                    },
                    {
                      "type": "actions",
                      "elements": [
                        {
                          "type": "button",
                          "text": {
                            "type": "plain_text",
                            "text": "View Workflow Run"
                          },
                          "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                        }
                      ]
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK